plugins {
    id 'java'
}

sourceSets {
    main {
        java {
            srcDir '.'
            include 'BowtieSjf4jValidator.java'
        }
    }
}

repositories {
    mavenCentral()
}


def version = '1.5.0'

dependencies {
    implementation "org.sjf4j:sjf4j-core:$version"
    implementation "org.sjf4j:sjf4j-schema:$version"
    annotationProcessor "org.sjf4j:sjf4j-processor:$version"

    implementation "org.sjf4j:sjf4j-backend-jackson2:$version"
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
}

jar {
    archiveBaseName = 'harness'
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes "Main-Class": "BowtieSjf4jValidator"
        attributes "Implementation-Group": "org.sjf4j"
        attributes "Implementation-Name": "sjf4j"
        attributes "Implementation-Version": version
    }
}
